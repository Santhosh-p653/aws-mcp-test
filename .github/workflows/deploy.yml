name: Deploy MCP Server to Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  LIGHTSAIL_SERVICE: my-mcp-service
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Podman & Lightsailctl Plugin
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      # 1. Enable Podman's Docker-compatible socket
      - name: Start Podman API Socket
        run: |
          sudo systemctl start podman.socket
          sudo chmod 666 /usr/local/run/podman/podman.sock || sudo chmod 666 /run/podman/podman.sock
          # Point DOCKER_HOST to Podman's socket so lightsailctl uses Podman transparently
          echo "DOCKER_HOST=unix:///run/podman/podman.sock" >> $GITHUB_ENV

      # 2. Build with Podman
      - name: Build image with Podman
        run: |
          podman build --platform linux/amd64 -t ${{ env.CONTAINER_NAME }}:latest .

      # 3. Push image to Lightsail container registry (Directly reads from Podman socket now)
      - name: Push image to Lightsail container registry
        run: |
          aws lightsail push-container-image \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --label ${{ env.CONTAINER_NAME }} \
            --image ${{ env.CONTAINER_NAME }}:latest

      # 4. Deploy to Lightsail container service
      - name: Deploy to Lightsail container service
        run: |
          IMAGE_TAG=$(aws lightsail get-container-images \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --query 'containerImages[0].image' \
            --output text)

          aws lightsail create-container-service-deployment \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --containers "{
              \"${{ env.CONTAINER_NAME }}\": {
                \"image\": \"$IMAGE_TAG\",
                \"ports\": {\"8080\": \"HTTP\"}
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"${{ env.CONTAINER_NAME }}\",
              \"containerPort\": 8080,
              \"healthCheck\": {\"path\": \"/healthz\"}
            }"
