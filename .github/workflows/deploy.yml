name: Deploy MCP Server to Lightsail

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  LIGHTSAIL_SERVICE: my-mcp-service
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lightsailctl Plugin
        run: |
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      # NEW: Ensure service exists and is READY
      - name: Ensure Lightsail Container Service is ready
        run: |
          echo "Checking if service ${{ env.LIGHTSAIL_SERVICE }} exists..."
          if ! aws lightsail get-container-services --service-name ${{ env.LIGHTSAIL_SERVICE }} --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Service does not exist. Creating..."
            aws lightsail create-container-service \
              --service-name ${{ env.LIGHTSAIL_SERVICE }} \
              --power micro \
              --scale 1 \
              --region ${{ env.AWS_REGION }}
          fi

          echo "Waiting for service to be READY..."
          while true; do
            STATE=$(aws lightsail get-container-services --service-name ${{ env.LIGHTSAIL_SERVICE }} --region ${{ env.AWS_REGION }} --query 'containerServices[0].state' --output text)
            echo "Current State: $STATE"
            if [ "$STATE" == "READY" ]; then
              echo "Service is ready!"
              break
            fi
            sleep 10
          done

      - name: Build image with Docker
        run: |
          docker build --platform linux/amd64 -t ${{ env.CONTAINER_NAME }}:latest .

      - name: Push image to Lightsail container registry
        run: |
          aws lightsail push-container-image \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --label ${{ env.CONTAINER_NAME }} \
            --image ${{ env.CONTAINER_NAME }}:latest

      - name: Deploy to Lightsail container service
        run: |
          IMAGE_TAG=$(aws lightsail get-container-images \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --query 'containerImages[0].image' \
            --output text)

          aws lightsail create-container-service-deployment \
            --region ${{ env.AWS_REGION }} \
            --service-name ${{ env.LIGHTSAIL_SERVICE }} \
            --containers "{
              \"${{ env.CONTAINER_NAME }}\": {
                \"image\": \"$IMAGE_TAG\",
                \"ports\": {\"8080\": \"HTTP\"}
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"${{ env.CONTAINER_NAME }}\",
              \"containerPort\": 8080,
              \"healthCheck\": {\"path\": \"/healthz\"}
            }"
